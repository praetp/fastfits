[package]
name = "fastfits"
version = "1.5.4"
edition = "2021"
license = "MIT"
authors = ["Paul Praet"]

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
egui = "0.32"
clap = { version = "4", features = ["derive"] }
fitsio = "0.21"
image = "0.25"
trash = "5"
anyhow = "1"
rfd = "0.14"
rayon = "1"
bayer = "0.1"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
urlencoding = "2"

[profile.release]
opt-level = 3
